    <!DOCTYPE html>
    <html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Registration Form</title>
    </head>
    
    <body>
        <!--FORM-->
      
    
        <form>
            <h1>Student Registration Form</h1>
    
            <label for="">Full Name:</label>
            <br>
            <input type="text" placeholder="Enter your name" required>
    
            <br><br>
    
            <label for="">Email:</label>
            <br>
            <input type="email" placeholder="Enter your email" required>
    
            <br><br>
    
            <label for="">Password:</label>
            <br>
            <input type="password" required>
    
            <br><br>
    
            <label>Gender:</label>
            <br>
            <label for="male"><input type="radio" name="Gender" id="male" required>Male</label>
            <label for="female"><input type="radio" name="Gender" id="female" required>Female</label>
    
            <br><br>
    
            <label>Skills:</label>
            <br>
    
            <label for="html"><input type="checkbox" name="skills" id="html" required> HTML</label>
            <label for="css"><input type="checkbox" name="skills" id="css" required> CSS</label>
            <label for="javascript"><input type="checkbox" name="skills" id="javascript" required> JavaScript</label>
    
            <br><br>
    
            <label for="">Date of Birth:</label>
            <br>
            <input type="date" required>
    
            <br><br>
    
            <button type="submit">Register</button>
    
        </form>
    

        <hr>
        <!--TABLE-->>
        <h1>Submitted Students (Dummy Data)</h1>
    
        <table border="1" cellpadding="8">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Gender</th>
                    <th>Skills</th>
                    <th>DOB</th>
                </tr>

                <tr>
                    <td>Alice</td>
                    <td>alice@example.com</td>
                    <td>Female</td>
                    <td>HTML, CSS</td>
                    <td>2002-05-10</td>
                </tr>
    
                <tr>
                    <td>Bob</td>
                    <td>bob@example.com</td>
                    <td>Male</td>
                    <td>JavaScript</td>
                    <td>2001-11-22</td>
                </tr>
    
        </table>
    
    </body>
    
    </html>
</body>
</html>
